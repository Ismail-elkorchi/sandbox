# Disposable CI contract only. This is not an operator installation recipe.
# Classify actual output delivery, not an address inventory or an mbuf tag
# whose lifetime does not extend across Darwin's loopback input path. Local
# unicast routes use lo0, including routes to another interface's own address.
# No factory state is created: every packet is evaluated after route selection.
block drop out quick on lo0 proto { tcp udp } user 65530
pass out quick proto tcp user 65530 flags any no state
pass out quick proto udp user 65530 no state
pass no state
