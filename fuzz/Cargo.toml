[package]
name = "sandbox-cargo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.145"
sandbox-digest = { path = "../crates/sandbox-digest" }
sandbox-guest = { path = "../crates/sandbox-guest" }
sandbox-image = { path = "../crates/sandbox-image" }
sandbox-launcher-windows = { path = "../crates/sandbox-launcher-windows" }
sandbox-network-broker = { path = "../crates/sandbox-network-broker" }
sandbox-platform = { path = "../crates/sandbox-platform" }
sandbox-policy = { path = "../crates/sandbox-policy" }
sandbox-protocol = { path = "../crates/sandbox-protocol" }
sandbox-vm = { path = "../crates/sandbox-vm" }

