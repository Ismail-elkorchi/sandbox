[package]
name = "sandbox-cargo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.145"
sandbox-digest = { path = "../crates/sandbox-digest" }
sandbox-image = { path = "../crates/sandbox-image" }
sandbox-network-broker = { path = "../crates/sandbox-network-broker" }
sandbox-policy = { path = "../crates/sandbox-policy" }
sandsurf-protocol = { path = "../crates/sandsurf-protocol" }
sandbox-vm = { path = "../crates/sandbox-vm" }

[[bin]]
name = "sandsurf_protocol"
path = "fuzz_targets/sandsurf_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_digest"
path = "fuzz_targets/canonical_digest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_rules"
path = "fuzz_targets/network_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "socks5"
path = "fuzz_targets/socks5.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_connect"
path = "fuzz_targets/http_connect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_manifest"
path = "fuzz_targets/image_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_protocol"
path = "fuzz_targets/guest_protocol.rs"
test = false
doc = false
bench = false
