name: KVM conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  firecracker:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl
      - run: test -r /dev/kvm && test -w /dev/kvm
      - run: test -x /usr/bin/busybox && test -x /usr/sbin/mkfs.ext4
      - run: SANDSURF_LOCAL_IMAGE=1 npm run build:guest-image
      - run: npm run fetch:firecracker
      - run: npm run build:native
      - run: npm run build:ts
      - run: npm run verify:native
      - run: cargo test --locked -p sandbox-vm -p sandbox-guest -p sandsurf-workload -p sandsurf-state -p sandsurf-control -p sandsurf-host
      - run: SANDSURF_KVM_TEST=1 node --test packages/sandbox/test/kvm-environment.test.mjs
