name: KVM conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  firecracker:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y guestfish qemu-system-x86
      - name: Read-only appliance kernel access
        run: sudo setfacl -m "u:$(id -un):r" /boot/vmlinuz-*
      - run: test -r /dev/kvm && test -w /dev/kvm
      - run: test -x /usr/bin/busybox && test -x /usr/sbin/mkfs.ext4 && command -v qemu-img
      - run: SANDSURF_LOCAL_IMAGE=1 npm run build:guest-image
      - run: npm run build:native
      - run: npm run build:ts
      - run: npm run verify:native
      - run: cargo test --locked -p sandsurf-guest -p sandsurf-state -p sandsurf-host
      - name: Installed services require an independent user service manager
        run: systemctl --user show-environment > /dev/null
      - run: npm run qualify:linux -- "$RUNNER_TEMP/linux-hardware-prerequisites.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-hardware-prerequisites
          path: |
            ${{ runner.temp }}/linux-hardware-prerequisites.json
            ${{ runner.temp }}/linux-hardware-prerequisites.json.result.json
            ${{ runner.temp }}/linux-hardware-prerequisites.json.evidence
