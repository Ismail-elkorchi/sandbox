name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make diffutils tar curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-meson
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - if: runner.os == 'Linux'
        uses: ./.github/actions/user-service-manager
      # Validate the committed current-format distribution input. Building a
      # fresh OS image requires KVM and belongs to development-images, not this
      # source/package gate. ARM distribution is blocked until a current ARM
      # bundle can be built on a native virtualization-enabled host.
      - run: npm run manifest:images
      - run: npm run build:ts
      - if: runner.os != 'Windows'
        run: npm run build:native
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: npm run build:native
      - run: npm run verify:native
      - run: npm run supply-chain
      - if: runner.os != 'Windows'
        run: npm run test:package
      - if: runner.os == 'Windows'
        name: Installed package under an independent native service owner (not VM qualification)
        run: ./scripts/qualification/windows-independent-contract.ps1 -Contract package

  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools bubblewrap nftables iproute2
      - uses: ./.github/actions/user-service-manager
      - run: npm ci
      - name: Native release assembly contracts
        run: npm run test:scripts
      - name: Native virtualization prerequisites (not VM qualification)
        run: node scripts/probe-sandsurf-host.ts sandsurf-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandsurf-host-linux
          path: sandsurf-host.json
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo fmt --all -- --check
      - run: npm run check:protocol
      - run: cargo test --locked -p sandsurf-protocol --features typescript --bin sandsurf-protocol-typescript
      - run: cargo clippy --locked -p sandsurf-protocol --features typescript --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build:ts
      - run: cargo build --locked -p sandsurf-host
      - name: Assemble the source-built native transport
        run: npm run build:native
      - run: cargo test --workspace
        env:
          SANDSURF_NATIVE_RESOURCE_TEST: "1"
      - name: Kernel NIC delivery boundary and transferred socket lifetime (no VM required)
        run: |
          test_binary=$(cargo test --locked -p sandsurf-native --lib --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "sandsurf_native" and .profile.test == true) | .executable')
          test -n "$test_binary"
          sudo unshare --net "$test_binary" network_sockets::tests::kernel_local_delivery_denial_survives_route_changes_and_factory_exit --exact --ignored --test-threads=1
      - name: Native packet egress and socket owner restart (no VM required)
        run: |
          test_binary=$(cargo test --locked -p sandsurf-network --test linux_egress --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "linux_egress" and .profile.test == true) | .executable')
          test -n "$test_binary"
          sudo env SANDSURF_NETWORK_TEST_HOST="$GITHUB_WORKSPACE/native/linux-x64/sandsurf-host-linux-x64" unshare --mount --net "$test_binary" native_tcp_udp_ipv4_ipv6_and_established_flow_revocation --exact --ignored --test-threads=1
      - run: npm run test:ts
      - run: npm run audit:licenses
      - run: npm run audit:unsafe
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      - run: cargo audit --file fuzz/Cargo.lock --deny warnings

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native release assembly contracts
        run: npm run test:scripts
      - name: Native virtualization prerequisites (not VM qualification)
        run: node scripts/probe-sandsurf-host.ts sandsurf-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandsurf-host-macos
          path: sandsurf-host.json
      - run: rustup toolchain install stable --profile minimal
      - run: cargo clippy -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host --all-targets -- -D warnings
      - run: npm run build:ts
      - run: brew install glib pixman ninja pkgconf meson python python-setuptools dtc
      - name: Compile and entitle the owned HVF runtime (not VM qualification)
        run: |
          npm run build:native
          codesign --verify --strict "native/macos-arm64/sandsurf-qemu-arm64"
          codesign --verify --strict "native/macos-arm64/sandsurf-resource-broker"
      - name: Install the explicit Darwin resource owner on this disposable CI host
        run: |
          sudo install -d -o root -g wheel -m 0755 /usr/local/libexec/sandsurf
          sudo cp -R native/macos-arm64/. /usr/local/libexec/sandsurf/
          sudo chown -R root:wheel /usr/local/libexec/sandsurf
          sudo chmod -R go-w /usr/local/libexec/sandsurf
          sudo chmod 4755 /usr/local/libexec/sandsurf/sandsurf-resource-broker
      - name: Darwin CPU, fatal footprint and lifetime contracts (no VM hardware required)
        run: |
          cargo build -p sandsurf-native --example darwin-budget-worker
          codesign --force --sign - --options runtime target/debug/examples/darwin-budget-worker
          trap 'sudo install -o root -g wheel -m 0755 native/macos-arm64/sandsurf-host-macos-arm64 /usr/local/libexec/sandsurf/sandsurf-host-macos-arm64; sudo install -o root -g wheel -m 0755 native/macos-arm64/sandsurf-qemu-arm64 /usr/local/libexec/sandsurf/sandsurf-qemu-arm64' EXIT
          sudo install -o root -g wheel -m 0755 target/debug/examples/darwin-budget-worker /usr/local/libexec/sandsurf/sandsurf-host-macos-arm64
          sudo install -o root -g wheel -m 0755 target/debug/examples/darwin-budget-worker /usr/local/libexec/sandsurf/sandsurf-qemu-arm64
          SANDSURF_DARWIN_RESOURCE_TEST=1 cargo test -p sandsurf-native --test darwin_resource_envelope -- --test-threads=1
      - run: cargo build --locked -p sandsurf-host
      - run: cargo test -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host
      - run: npm run test:ts
      - name: Sandsurf authority and wire contracts (not VM qualification)
        run: node --test packages/sandsurf/test/sandsurf-contracts.test.mjs

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native release assembly contracts
        run: npm run test:scripts
      - name: Native virtualization prerequisites (not VM qualification)
        run: node scripts/probe-sandsurf-host.ts sandsurf-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandsurf-host-windows
          path: sandsurf-host.json
      - run: rustup toolchain install stable --profile minimal
      - run: cargo clippy -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host --all-targets -- -D warnings
      - run: npm run build:ts
      - run: cargo build --locked -p sandsurf-host
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make diffutils tar curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-meson
      - name: Assemble the source-built native transport
        shell: msys2 {0}
        run: npm run build:native
      - run: cargo test --no-fail-fast -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host
      - name: Windows owned Job and transferred disk custody contracts (no VM hardware required)
        run: |
          cargo build -p sandsurf-native --example windows-budget-worker
          $artifacts = cargo test --locked -p sandsurf-native --test windows_resource_envelope --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Native kernel contract compilation failed' }
          $binary = @($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'windows_resource_envelope' -and $_.profile.test })
          if ($binary.Count -ne 1 -or -not $binary[0].executable) { throw 'Missing unique native test executable' }
          ./scripts/qualification/windows-independent-contract.ps1 -Contract kernel -TestBinary ($binary[0].executable)
      - run: npm run test:ts
      - name: Sandsurf authority and wire contracts (not VM qualification)
        run: node --test packages/sandsurf/test/sandsurf-contracts.test.mjs

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz every required trust-boundary parser
        run: |
          for target in sandsurf_protocol canonical_digest network_rules network_packet image_manifest image_archive guest_protocol firecracker_api; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -max_len=1048576
          done
