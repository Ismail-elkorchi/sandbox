name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p sandbox-supervisor --target x86_64-unknown-linux-musl -- -D warnings
      - run: cargo clippy -p sandbox-supervisor --target aarch64-unknown-linux-musl -- -D warnings
      - run: npm run build:ts
      - run: npm run build:native
      - run: npm run verify:native
      - run: cargo test --workspace
      - run: node --test packages/sandbox/test/*.test.mjs
      - run: npm run test:package
      - run: npm run audit:licenses
      - run: npm run audit:unsafe
      - run: npm run supply-chain
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      - run: cargo audit --file fuzz/Cargo.lock --deny warnings

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: cargo clippy -p sandbox-protocol -p sandbox-digest -p sandbox-policy -p sandbox-launcher-macos -p sandbox-platform-portable -p sandbox-supervisor -p sandbox-test-runtime --all-targets -- -D warnings
      - run: npm run build:ts
      - run: npm run build:native
      - run: cargo test -p sandbox-protocol -p sandbox-digest -p sandbox-policy -p sandbox-launcher-macos -p sandbox-platform-portable -p sandbox-test-runtime
      - run: node --test packages/sandbox/test/protocol.test.mjs packages/sandbox/test/macos-conformance.test.mjs

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: cargo clippy -p sandbox-protocol -p sandbox-digest -p sandbox-policy -p sandbox-launcher-windows -p sandbox-platform-portable -p sandbox-supervisor -p sandbox-test-runtime --all-targets -- -D warnings
      - run: npm run build:ts
      - run: npm run build:native
      - run: cargo test -p sandbox-protocol -p sandbox-digest -p sandbox-policy -p sandbox-launcher-windows -p sandbox-platform-portable -p sandbox-test-runtime
      - run: node --test packages/sandbox/test/protocol.test.mjs packages/sandbox/test/windows-conformance.test.mjs

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz every required trust-boundary parser
        run: |
          for target in protocol control_messages canonical_digest policy paths host_paths environment_block windows_arguments network_rules dns socks5 http_connect image_manifest guest_protocol artifact_manifest changesets; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -max_len=1048576
          done
