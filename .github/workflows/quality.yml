name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/development-images.yml

  distribution:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x64
          - runner: macos-15
            architecture: arm64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - if: runner.os == 'Linux'
        uses: ./.github/actions/user-service-manager
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: development-image-${{ matrix.architecture }}
          path: .
      - run: npm run manifest:images
      - run: npm run build:ts
      - run: npm run build:native
      - run: npm run verify:native
      - run: npm run supply-chain
      - run: npm run test:package

  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools guestfish qemu-system-x86
      - name: Read-only appliance kernel access
        run: sudo setfacl -m "u:$(id -un):r" /boot/vmlinuz-*
      - uses: ./.github/actions/user-service-manager
      - run: npm ci
      - name: Native release assembly contracts
        run: npm run test:scripts
      - name: Native virtualization prerequisites (not VM qualification)
        run: node scripts/probe-sandsurf-host.ts sandsurf-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandsurf-host-linux
          path: sandsurf-host.json
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p sandsurf-host --all-targets --features apple-source-check -- -D warnings
      - run: npm run build:ts
      - run: cargo build --locked -p sandsurf-host
      - run: cargo test --workspace
      - run: node --test packages/sandsurf/test/*.test.mjs
      - run: npm run audit:licenses
      - run: npm run audit:unsafe
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      - run: cargo audit --file fuzz/Cargo.lock --deny warnings

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native release assembly contracts
        run: npm run test:scripts
      - name: Native virtualization prerequisites (not VM qualification)
        run: node scripts/probe-sandsurf-host.ts sandsurf-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandsurf-host-macos
          path: sandsurf-host.json
      - run: rustup toolchain install stable --profile minimal
      - run: cargo clippy -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host --all-targets -- -D warnings
      - run: npm run build:ts
      - name: Native Apple owner contracts (not VM qualification)
        run: |
          swiftc -parse-as-library native/macos/owner-protocol.swift native/macos/unix-socket.swift scripts/qualification/apple-local-socket.swift -o "$RUNNER_TEMP/sandsurf-apple-control-test"
          "$RUNNER_TEMP/sandsurf-apple-control-test" native/macos/fixtures/create.json
      - run: cargo build --locked -p sandsurf-host
      - run: cargo test -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host
      - run: node --test packages/sandsurf/test/*.test.mjs
      - name: Sandsurf authority and wire contracts (not VM qualification)
        run: node --test packages/sandsurf/test/sandsurf-contracts.test.mjs

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native release assembly contracts
        run: npm run test:scripts
      - name: Native virtualization prerequisites (not VM qualification)
        run: node scripts/probe-sandsurf-host.ts sandsurf-host.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandsurf-host-windows
          path: sandsurf-host.json
      - run: rustup toolchain install stable --profile minimal
      - run: cargo clippy -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host --all-targets -- -D warnings
      - run: npm run build:ts
      - run: cargo build --locked -p sandsurf-host
      - run: cargo test -p sandsurf-protocol -p sandsurf-state -p sandsurf-native -p sandsurf-image -p sandsurf-machine -p sandsurf-host
      - run: node --test packages/sandsurf/test/*.test.mjs
      - name: Sandsurf authority and wire contracts (not VM qualification)
        run: node --test packages/sandsurf/test/sandsurf-contracts.test.mjs

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz every required trust-boundary parser
        run: |
          for target in sandsurf_protocol canonical_digest network_rules network_packet image_manifest image_archive guest_protocol firecracker_api; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -max_len=1048576
          done
