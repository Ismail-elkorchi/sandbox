name: Native network boundary experiments
on:
  push:
    branches: [main]
    paths:
      - vmm/qemu/tests/windows-local-delivery.c
      - vmm/qemu/tests/darwin-local-delivery.c
      - vmm/qemu/tests/darwin-network-native.c
      - crates/sandsurf-native/src/darwin_socket.c
      - .github/workflows/native-network-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  darwin-observation:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Observe the native PF control surface (no VM hardware required)
        shell: bash
        run: |
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then exit 1; fi
          clang -std=c11 -Wall -Wextra -Werror vmm/qemu/tests/darwin-network-native.c crates/sandsurf-native/src/darwin_socket.c -o darwin-network-native
          clang -std=c11 -Wall -Wextra -Werror vmm/qemu/tests/darwin-local-delivery.c crates/sandsurf-native/src/darwin_socket.c -o darwin-local-delivery
          sudo chown root:wheel darwin-network-native
          sudo chmod go-w darwin-network-native
          sudo ./darwin-network-native
          trap 'sudo ifconfig lo0 -alias 198.18.0.9 2>/dev/null || true; sudo pfctl -d; sudo pfctl -f /etc/pf.conf' EXIT
          sudo pfctl -f vmm/qemu/tests/darwin-local-delivery.conf
          sudo pfctl -e
          sudo pfctl -sa -vv
          sudo pfctl -s Interfaces -v
          sudo ./darwin-local-delivery
  windows-network:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build the actual native socket-isolation experiment
        shell: msys2 {0}
        run: gcc -std=c11 -Wall -Wextra -Werror -static vmm/qemu/tests/windows-local-delivery.c -o windows-local-delivery.exe -lws2_32 -luserenv -ladvapi32
      - name: Socket transfer, original owner exit and address changes (no VM hardware required)
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'This address experiment requires a disposable hosted runner' }
          try {
            ./windows-local-delivery.exe
            if ($LASTEXITCODE -ne 0) { throw 'Native socket isolation is insufficient; no product guarantee is established' }
          } finally {
            Get-NetIPAddress -InterfaceIndex 1 -IPAddress 198.18.0.9 -ErrorAction SilentlyContinue | Remove-NetIPAddress -Confirm:$false
          }
