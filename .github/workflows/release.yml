name: release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x64
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            architecture: arm64
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools qemu-utils
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add ${{ matrix.rust_target }}
      - name: Materialize release image signing key
        shell: bash
        env:
          SANDSURF_IMAGE_SIGNING_KEY_HEX: ${{ secrets.SANDSURF_IMAGE_SIGNING_KEY_HEX }}
        run: |
          test "${#SANDSURF_IMAGE_SIGNING_KEY_HEX}" -eq 64
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync(process.env.RUNNER_TEMP + '/sandsurf-image-signing-key', Buffer.from(process.env.SANDSURF_IMAGE_SIGNING_KEY_HEX, 'hex'), { mode: 0o600, flag: 'wx' })"
      - run: npm run build:guest-image
        env:
          SANDSURF_IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
          SANDSURF_IMAGE_SIGNING_KEY_FILE: ${{ runner.temp }}/sandsurf-image-signing-key
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-image-${{ matrix.architecture }}
          path: packages/sandbox/images/development-${{ matrix.architecture }}
          if-no-files-found: error

  native:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            artifact: linux-x64
            image_architecture: x64
          - runner: ubuntu-26.04-arm
            artifact: linux-arm64
            image_architecture: arm64
          - runner: macos-13
            artifact: macos-x64
            image_architecture: x64
          - runner: macos-14
            artifact: macos-arm64
            image_architecture: arm64
          - runner: windows-2025
            artifact: windows-x64
            image_architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-image-${{ matrix.image_architecture }}
          path: packages/sandbox/images/development-${{ matrix.image_architecture }}
      - run: npm run manifest:images
      - if: startsWith(matrix.artifact, 'linux-')
        run: npm run fetch:firecracker
      - run: npm run build:ts
      - run: npm run build:native
      - run: node --test packages/sandbox/test/*.test.mjs
      - if: startsWith(matrix.artifact, 'linux-')
        run: node scripts/qualify-linux-backend.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.artifact }}
          path: packages/sandbox/native/${{ matrix.artifact }}
          if-no-files-found: error

  assemble:
    needs: [images, native]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: staged-runtimes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-image-x64
          path: packages/sandbox/images/development-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-image-arm64
          path: packages/sandbox/images/development-arm64
      - name: Assemble platform directories
        shell: bash
        run: |
          for directory in staged-runtimes/runtime-*; do
            platform="${directory##*/runtime-}"
            mkdir -p "packages/sandbox/native/$platform"
            cp -a "$directory/." "packages/sandbox/native/$platform/"
          done
      - run: node scripts/rebuild-native-manifest.ts
      - run: npm run manifest:images
        env:
          SANDSURF_REQUIRED_IMAGE_ARCHITECTURES: x64,arm64
      - run: npm run build:ts
      - run: npm run verify:native
        env:
          SANDSURF_REQUIRED_IMAGE_ARCHITECTURES: x64,arm64
      - run: npm run supply-chain
      - run: npm run test:package
        env:
          SANDSURF_REQUIRED_IMAGE_ARCHITECTURES: x64,arm64
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs-and-supply-chain
          path: |
            release/*.tgz
            packages/sandbox/SBOM.cdx.json
            packages/sandbox/THIRD-PARTY
            Cargo.lock
            package-lock.json
          if-no-files-found: error
