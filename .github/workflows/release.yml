name: release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SANDSURF_NATIVE_PROFILE: release
  SANDSURF_IMAGE_PROFILE: release

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x64
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            architecture: arm64
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools qemu-utils guestfish ${{ matrix.architecture == 'arm64' && 'qemu-system-arm' || 'qemu-system-x86' }} acl
      - name: Require native isolated image building
        run: test -r /dev/kvm && test -w /dev/kvm
      - name: Read-only appliance kernel access
        run: sudo setfacl -m "u:$(id -un):r" /boot/vmlinuz-*
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add ${{ matrix.rust_target }}
      - name: Materialize release image signing key
        shell: bash
        env:
          SANDSURF_IMAGE_SIGNING_KEY_HEX: ${{ secrets.SANDSURF_IMAGE_SIGNING_KEY_HEX }}
        run: |
          test "${#SANDSURF_IMAGE_SIGNING_KEY_HEX}" -eq 64
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync(process.env.RUNNER_TEMP + '/sandsurf-image-signing-key', Buffer.from(process.env.SANDSURF_IMAGE_SIGNING_KEY_HEX, 'hex'), { mode: 0o600, flag: 'wx' })"
      - run: npm run build:guest-image
        env:
          SANDSURF_IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
          SANDSURF_IMAGE_SIGNING_KEY_FILE: ${{ runner.temp }}/sandsurf-image-signing-key
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-image-${{ matrix.architecture }}
          path: packages/sandsurf/images/development-${{ matrix.architecture }}
          if-no-files-found: error

  native:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            artifact: linux-x64
            image_architecture: x64
          - runner: ubuntu-26.04-arm
            artifact: linux-arm64
            image_architecture: arm64
          - runner: macos-15-intel
            artifact: macos-x64
            image_architecture: x64
          - runner: macos-15
            artifact: macos-arm64
            image_architecture: arm64
          - runner: windows-2025
            artifact: windows-x64
            image_architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools
      - if: runner.os == 'Linux'
        uses: ./.github/actions/user-service-manager
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-image-${{ matrix.image_architecture }}
          path: packages/sandsurf/images/development-${{ matrix.image_architecture }}
      - run: npm run manifest:images
      - run: npm run build:ts
      - if: runner.os == 'macOS'
        run: brew install glib pixman ninja pkgconf meson python python-setuptools dtc
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make diffutils tar curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-meson
      - if: runner.os != 'Windows'
        run: npm run build:native
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: npm run build:native
      - run: npm run test:ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.artifact }}
          path: |
            packages/sandsurf/native/${{ matrix.artifact }}
            packages/sandsurf/native/manifest.json
            packages/sandsurf/native/qemu-source
          if-no-files-found: error

  assemble:
    needs: [images, native]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: ./.github/actions/user-service-manager
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: staged-runtimes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-image-x64
          path: packages/sandsurf/images/development-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-image-arm64
          path: packages/sandsurf/images/development-arm64
      - name: Assemble the complete verified native package
        run: node scripts/assemble-release-native.ts
      - run: npm run manifest:images
        env:
          SANDSURF_REQUIRED_IMAGE_ARCHITECTURES: x64,arm64
      - run: npm run build:ts
      - run: npm run verify:native
        env:
          SANDSURF_REQUIRED_IMAGE_ARCHITECTURES: x64,arm64
      - run: npm run supply-chain
      - run: npm run test:package
        env:
          SANDSURF_REQUIRED_IMAGE_ARCHITECTURES: x64,arm64
          SANDSURF_REQUIRED_NATIVE_PLATFORMS: linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs-and-supply-chain
          path: |
            release/*.tgz
            packages/sandsurf/SBOM.cdx.json
            packages/sandsurf/THIRD-PARTY
            Cargo.lock
            package-lock.json
          if-no-files-found: error
