name: development guest images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x64
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            architecture: arm64
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools qemu-utils
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add ${{ matrix.rust_target }}
      - run: SANDSURF_LOCAL_IMAGE=1 npm run build:guest-image
        env:
          SANDSURF_IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-image-${{ matrix.architecture }}
          path: |
            packages/sandbox/images/development-${{ matrix.architecture }}
            image-sources/development-${{ matrix.architecture }}
          if-no-files-found: error
