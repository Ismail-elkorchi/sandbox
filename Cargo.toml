[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
  "crates/sandsurf-protocol",
  "crates/sandsurf-state",
  "crates/sandsurf-native",
  "crates/sandsurf-machine",
  "crates/sandsurf-control",
  "crates/sandsurf-workload",
  "crates/sandsurf-host",
  "crates/sandbox-digest",
  "crates/sandbox-policy",
  "crates/sandbox-launcher-linux",
  "crates/sandbox-network-broker",
  "crates/sandbox-fuzz",
  "crates/sandbox-image",
  "crates/sandbox-vm",
  "crates/sandbox-guest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
libc = "=0.2.177"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
windows-sys = "=0.61.2"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = { version = "=0.2.17", default-features = false, features = ["std"] }
hmac = { version = "=0.12.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
unicode-normalization = "=0.1.25"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "fallible_uint"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
arcbox-ext4 = "=0.1.2"
uuid = { version = "=1.23.0", default-features = false, features = ["std"] }
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
netstack-smoltcp = "=0.2.4"
tokio = { version = "=1.50.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[profile.release]
panic = "abort"
overflow-checks = true
strip = "symbols"
lto = "thin"
codegen-units = 1
